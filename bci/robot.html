<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#d8e8ee;font-family:system-ui,sans-serif}
    #canvas{width:100%;height:100%;display:block;background:#071019}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#071019;z-index:2}.loadbox{text-align:center;width:52%}.track{height:4px;background:#1d3440;border-radius:9px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#35d8c2;transition:width .2s}.label{font-size:12px;letter-spacing:.14em;color:#7796a3}.error{color:#ff8090;padding:20px}
  </style>
</head>
<body>
  <canvas id="canvas" width="960" height="600" tabindex="-1"></canvas>
  <div class="loading" id="loading"><div class="loadbox"><div class="label">UNITY WEBGL · ROBOT TERMINAL</div><div class="track"><div class="bar" id="bar"></div></div></div></div>
  <script src="./unity/Build/robot-webgl-build.loader.js?v=perf6"></script>
  <script>
    let instance=null, pending=null, pauseRequested=false;
    const config={dataUrl:'./unity/Build/robot-webgl-build.data?v=perf6',frameworkUrl:'./unity/Build/robot-webgl-build.framework.js?v=perf6',codeUrl:'./unity/Build/robot-webgl-build.wasm?v=perf6',streamingAssetsUrl:'./unity/StreamingAssets',companyName:'DefaultCompany',productName:'UR16E大模型抓取实验',productVersion:'1.8',devicePixelRatio:.75,showBanner:(m,t)=>console[t==='error'?'error':'warn'](m)};
    createUnityInstance(document.querySelector('#canvas'),config,p=>document.querySelector('#bar').style.width=(p*100)+'%').then(i=>{instance=i;document.querySelector('#loading').remove();setUnityPaused(pauseRequested);parent.postMessage({type:'unity-ready',view:'robot'},'*');if(pending)selectTarget(...pending)}).catch(e=>{document.querySelector('#loading').innerHTML='<div class="error">Unity加载失败：'+e+'</div>'});
    function selectTarget(cls,conf){if(!instance){pending=[cls,conf];return}pending=null;instance.SendMessage('RobotWebBridge','SelectTarget',`${cls},${conf}`)}
    function presentStimulus(cls){if(!instance)return;instance.SendMessage('RobotWebBridge','PresentStimulus',`${cls}`)}
    function setUnityPaused(paused){pauseRequested=!!paused;if(!instance?.Module)return;const fn=pauseRequested?'pauseMainLoop':'resumeMainLoop';if(typeof instance.Module[fn]==='function')instance.Module[fn]()}
  </script>
</body>
</html>
