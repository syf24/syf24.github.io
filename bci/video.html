<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#d8e8ee;font-family:system-ui,sans-serif}
    #canvas{width:100%;height:100%;display:block;background:#071019}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#071019;z-index:2}.loadbox{text-align:center;width:52%}.track{height:4px;background:#1d3440;border-radius:9px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#6b9cff;transition:width .2s}.label{font-size:12px;letter-spacing:.14em;color:#7796a3}.error{color:#ff8090;padding:20px}
  .credits{position:absolute;top:8px;right:10px;color:#c6d4dd;background:#071019bb;padding:4px 8px;border-radius:5px;font-size:11px;text-decoration:none;z-index:1}
    .start{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#07101988}.start[hidden]{display:none}.start button{padding:16px 28px;border:0;border-radius:12px;background:#70e0c1;color:#08231c;font:600 18px system-ui;cursor:pointer}
  </style>
</head>
<body>
  <canvas id="canvas" width="960" height="600" tabindex="-1"></canvas>
  <div class="loading" id="loading"><div class="loadbox"><div class="label">UNITY WEBGL · VIDEO TERMINAL</div><div class="track"><div class="bar" id="bar"></div></div></div></div>
  <div class="start" id="start" hidden><button id="startButton" type="button">▶ 点击开始播放</button></div>
  <a class="credits" href="./media/animations-v1/credits.html" target="_blank" rel="noopener">动画素材 · 来源与授权</a>
  <script src="./video-unity/Build/WebGLBuildDashboard.loader.js"></script>
  <script>
    // Keep scrolling the surrounding page while the pointer is over Unity.
    if (window.parent !== window) {
      document.addEventListener('wheel', event => {
        if (event.ctrlKey || event.metaKey) return;
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
        event.preventDefault();
        event.stopImmediatePropagation();
        window.parent.scrollBy({left:event.deltaX * unit, top:event.deltaY * unit, behavior:'instant'});
      }, {capture:true, passive:false});
      let touchY = null;
      document.addEventListener('touchstart', event => {
        touchY = event.touches.length === 1 ? event.touches[0].clientY : null;
      }, {capture:true, passive:true});
      document.addEventListener('touchmove', event => {
        if (touchY === null || event.touches.length !== 1) return;
        const y = event.touches[0].clientY;
        event.preventDefault();
        event.stopImmediatePropagation();
        window.parent.scrollBy({top:touchY - y, behavior:'instant'});
        touchY = y;
      }, {capture:true, passive:false});
      for (const name of ['touchend', 'touchcancel']) {
        document.addEventListener(name, () => {touchY = null;}, {passive:true});
      }
    }
    let instance=null, pending=null, started=false;
    const config={dataUrl:'./video-unity/Build/WebGLBuildDashboard.data?v=background1',frameworkUrl:'./video-unity/Build/WebGLBuildDashboard.framework.js?v=background1',codeUrl:'./video-unity/Build/WebGLBuildDashboard.wasm?v=background1',streamingAssetsUrl:'./media/animations-v1',companyName:'DefaultCompany',productName:'BCI Video Player',productVersion:'1.0',showBanner:(m,t)=>console[t==='error'?'error':'warn'](m)};
    createUnityInstance(document.querySelector('#canvas'),config,p=>document.querySelector('#bar').style.width=(p*100)+'%').then(i=>{instance=i;document.querySelector('#loading').remove();document.querySelector('#start').hidden=false;parent.postMessage({type:'unity-ready',view:'video'},'*');}).catch(e=>{document.querySelector('#loading').innerHTML='<div class="error">Unity加载失败：'+e+'</div>'});
    document.querySelector('#startButton').addEventListener('click',()=>{
      if(!instance||started)return;
      started=true;
      document.querySelector('#start').hidden=true;
      document.querySelector('#canvas').focus();
      if(pending)selectTarget(...pending);
    });
    function selectTarget(cls,conf){if(!instance||!started)throw new Error('请先在视频区域点击开始播放');pending=null;instance.SendMessage('VideoWebBridge','SelectTarget',`${cls},${conf}`)}
  </script>
</body>
</html>
